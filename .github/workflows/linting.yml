name: Linting

on: [push, pull_request]

jobs:
  lint:
    name: Lint PHP files
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up PHP environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: cs2pr, composer:v2

      - name: Get Composer cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Use Composer cache
        uses: actions/cache@v4
        with:
          path: ${{ steps['composer-cache'].outputs.dir }}
          key: ${{ runner.os }}-composer-8.2-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-8.2-

      - name: Install Composer dependencies & cache dependencies
        run: composer update --prefer-stable --prefer-dist --no-progress --no-interaction

      - name: Run Linter
        run: vendor/bin/parallel-lint -j 10 . --exclude vendor --exclude tools --checkstyle | cs2pr

  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up PHP environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: cs2pr, composer:v2

      - name: Get Composer cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Use Composer cache
        uses: actions/cache@v4
        with:
          path: ${{ steps['composer-cache'].outputs.dir }}
          key: ${{ runner.os }}-composer-8.2-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-8.2-

      - name: Install PHP-CS-Fixer
        run: composer update -W --working-dir=tools/php-cs-fixer --prefer-stable --prefer-dist --no-progress --no-interaction

      - name: Run PHP-CS-Fixer
        run: tools/php-cs-fixer/vendor/bin/php-cs-fixer fix -v --diff --dry-run --format=checkstyle | cs2pr
